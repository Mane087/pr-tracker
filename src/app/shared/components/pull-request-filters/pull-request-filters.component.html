<div class="flex flex-wrap items-center gap-2 text-sm" role="search">
  <label class="field min-w-56 flex-1">
    <span class="sr-only">Buscar</span>
    <app-icon name="search" class="text-ink-subtle" />
    <input
      type="search"
      autocomplete="off"
      placeholder="Buscar por título, repositorio o #número"
      [value]="value().search"
      (input)="onSearchInput($event)"
    />
  </label>

  <label class="field">
    <span class="field-label">Estado</span>
    <select (change)="onStatusChange($event)">
      <option value="" [selected]="value().status === ''">Todos</option>
      @for (option of statusOptions(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value().status">
          {{ option.label }}
        </option>
      }
    </select>
    <app-icon name="chevron-down" size="14" class="field-chevron" />
  </label>

  @if (accounts().length > 1) {
    <label class="field">
      <span class="field-label">Cuenta</span>
      <select (change)="onAccountChange($event)">
        <option value="" [selected]="value().accountId === ''">Todas</option>
        @for (account of accounts(); track account.id) {
          <option [value]="account.id" [selected]="account.id === value().accountId">
            {{ account.name }}
          </option>
        }
      </select>
      <app-icon name="chevron-down" size="14" class="field-chevron" />
    </label>
  }

  <label class="field">
    <span class="field-label">Orden</span>
    <select (change)="onSortChange($event)">
      @for (option of sortOptions; track option.value) {
        <option [value]="option.value" [selected]="option.value === value().sortKey">
          {{ option.label }}
        </option>
      }
    </select>
    <app-icon name="chevron-down" size="14" class="field-chevron" />
  </label>

  <label
    class="inline-flex cursor-pointer items-center gap-2 px-2 text-[13px] font-medium text-ink-muted"
  >
    <input
      type="checkbox"
      role="switch"
      class="switch"
      [checked]="value().isAttentionOnly"
      (change)="onAttentionChange($event)"
    />
    Solo con atención
  </label>

  <span class="px-2 font-mono text-xs text-ink-subtle" aria-live="polite">
    {{ visibleCount() }} de {{ totalCount() }}
  </span>

  @if (hasActiveFilters()) {
    <button type="button" class="btn btn-ghost btn-sm" (click)="reset()">
      <app-icon name="close" size="14" />
      Limpiar filtros
    </button>
  }
</div>
