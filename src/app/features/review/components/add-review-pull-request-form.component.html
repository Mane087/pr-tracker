<form
  class="grid gap-3 sm:grid-cols-[minmax(0,200px)_minmax(0,1fr)_120px_auto] sm:items-start"
  novalidate
  (submit)="onSubmit($event)"
>
  <label class="block text-xs font-semibold text-ink-muted">
    Cuenta
    <span class="field field-lg mt-1.5 font-normal text-ink">
      <select [formField]="pullRequestForm.accountId">
        <option value="">Selecciona una cuenta</option>
        @for (account of sessions.accounts(); track account.id) {
          <option [value]="account.id">
            {{ account.name }}{{ account.hasToken ? '' : ' · token requerido' }}
          </option>
        }
      </select>
      <app-icon name="chevron-down" size="14" class="field-chevron" />
    </span>
    @if (pullRequestForm.accountId().touched() && pullRequestForm.accountId().invalid()) {
      <span class="mt-1 block font-normal text-danger-ink">{{
        pullRequestForm.accountId().errors()[0]?.message
      }}</span>
    }
  </label>

  <label class="block text-xs font-semibold text-ink-muted">
    Repositorio
    <span class="field field-lg mt-1.5 font-normal text-ink">
      <app-icon name="repository" class="text-ink-subtle" />
      <select class="font-mono" [formField]="pullRequestForm.repository">
        @if (isLoadingRepositories()) {
          <option value="">Cargando repositorios…</option>
        } @else if (!selectedAccount()?.hasToken) {
          <option value="">Ingresa el token de la cuenta</option>
        } @else if (repositories().length === 0) {
          <option value="">Sin repositorios accesibles</option>
        } @else {
          <option value="">Selecciona un repositorio</option>
          @for (repository of repositories(); track repository.id) {
            <option [value]="repository.fullName">{{ repository.fullName }}</option>
          }
        }
      </select>
      <app-icon name="chevron-down" size="14" class="field-chevron" />
    </span>
    @if (repositoriesError()) {
      <span class="mt-1 block font-normal text-danger-ink">{{ repositoriesError() }}</span>
    } @else if (pullRequestForm.repository().touched() && pullRequestForm.repository().invalid()) {
      <span class="mt-1 block font-normal text-danger-ink">{{
        pullRequestForm.repository().errors()[0]?.message
      }}</span>
    }
  </label>

  <div class="block text-xs font-semibold text-ink-muted">
    <label for="review-pull-request-number">PR</label>
    <span class="field field-lg mt-1.5 font-normal text-ink">
      <span class="font-mono text-ink-subtle" aria-hidden="true">#</span>
      <input
        id="review-pull-request-number"
        type="number"
        inputmode="numeric"
        class="font-mono"
        [formField]="pullRequestForm.number"
      />
    </span>
    @if (pullRequestForm.number().touched() && pullRequestForm.number().invalid()) {
      <span class="mt-1 block font-normal text-danger-ink">{{
        pullRequestForm.number().errors()[0]?.message
      }}</span>
    }
  </div>

  <button
    type="submit"
    class="btn btn-primary sm:mt-[1.375rem]"
    [disabled]="pullRequestForm().submitting()"
  >
    @if (pullRequestForm().submitting()) {
      <app-icon name="reload" class="animate-spin" />
      Buscando…
    } @else {
      <app-icon name="search" />
      Agregar
    }
  </button>

  @if (errorMessage()) {
    <p role="alert" class="notice bg-danger-soft text-danger-ink sm:col-span-4">
      <app-icon name="alert" />
      {{ errorMessage() }}
    </p>
  }
  @if (successMessage()) {
    <p role="status" class="notice bg-success-soft text-success-ink sm:col-span-4">
      <app-icon name="check-circle" />
      {{ successMessage() }}
    </p>
  }
</form>
