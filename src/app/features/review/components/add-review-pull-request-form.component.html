<form
  class="grid gap-3 sm:grid-cols-[1fr_2fr_auto_auto] sm:items-end"
  novalidate
  (submit)="onSubmit($event)"
>
  <label class="block text-sm">
    <span class="font-medium">Cuenta</span>
    <select
      class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-2 py-2 dark:border-slate-700 dark:bg-slate-900"
      [formField]="pullRequestForm.accountId"
    >
      <option value="">Selecciona una cuenta</option>
      @for (account of sessions.accounts(); track account.id) {
        <option [value]="account.id">
          {{ account.name }}{{ account.hasToken ? '' : ' · token requerido' }}
        </option>
      }
    </select>
    @if (pullRequestForm.accountId().touched() && pullRequestForm.accountId().invalid()) {
      <span class="mt-1 block text-red-700 dark:text-red-400">{{
        pullRequestForm.accountId().errors()[0]?.message
      }}</span>
    }
  </label>

  <label class="block text-sm">
    <span class="font-medium">Repositorio</span>
    <input
      type="text"
      autocomplete="off"
      placeholder="propietario/nombre"
      list="review-repository-suggestions"
      class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"
      [formField]="pullRequestForm.repository"
    />
    <datalist id="review-repository-suggestions">
      @for (fullName of suggestedRepositories(); track fullName) {
        <option [value]="fullName"></option>
      }
    </datalist>
    @if (pullRequestForm.repository().touched() && pullRequestForm.repository().invalid()) {
      <span class="mt-1 block text-red-700 dark:text-red-400">{{
        pullRequestForm.repository().errors()[0]?.message
      }}</span>
    }
  </label>

  <label class="block text-sm">
    <span class="font-medium">PR</span>
    <input
      type="number"
      inputmode="numeric"
      class="mt-1 block w-24 rounded-md border border-slate-300 bg-white px-3 py-2 dark:border-slate-700 dark:bg-slate-900"
      [formField]="pullRequestForm.number"
    />
    @if (pullRequestForm.number().touched() && pullRequestForm.number().invalid()) {
      <span class="mt-1 block text-red-700 dark:text-red-400">{{
        pullRequestForm.number().errors()[0]?.message
      }}</span>
    }
  </label>

  <button
    type="submit"
    class="rounded-md bg-lime-600 px-4 py-2 text-sm font-medium text-white hover:bg-lime-700 disabled:opacity-60"
    [disabled]="pullRequestForm().submitting()"
  >
    {{ pullRequestForm().submitting() ? 'Buscando…' : 'Agregar' }}
  </button>

  @if (errorMessage()) {
    <p role="alert" class="text-sm text-red-700 sm:col-span-4 dark:text-red-400">
      {{ errorMessage() }}
    </p>
  }
  @if (successMessage()) {
    <p role="status" class="text-sm text-slate-700 sm:col-span-4 dark:text-slate-300">
      {{ successMessage() }}
    </p>
  }
</form>
